# Group A: named-contact campaign (python main.py send-group campaigns/group_a.yaml [--dry-run]).
# Each entry is sent once, word for word, at most GROUP_DAILY_LIMIT a day; its followup_body goes
# out once, in the same thread, 4 working days later if there is no reply. Add new entries at
# the end: the same command sends only the ones not sent yet.

- to: stephen@groundworkpm.com
  contact_name: Stephen
  company: GroundWork PM
  website: groundworkpm.com
  subject: "SMS notifications for GroundWork PM tenants"
  body: |
    Hi Stephen,

    I came across GroundWork PM and was interested in what you're building to simplify property management, particularly how you're bringing rent tracking, payments and maintenance operations into one platform.

    I'm reaching out from TalkSasa, a Kenyan Bulk SMS provider. We help businesses automate customer communication through reliable SMS delivery and API integrations.

    I see a potential opportunity to complement GroundWork PM by enabling automated SMS notifications for tenants, such as rent reminders, payment confirmations, maintenance updates and important property announcements.

    Rather than having property managers manually follow up with tenants, these notifications could be triggered directly from the platform.

    I'd be interested in having a brief 15-minute conversation to understand how you're currently handling tenant notifications and explore whether a TalkSasa integration could add value to GroundWork PM.

    Would you be available for a short call sometime this week?

    Best regards,
    Mary
    TalkSasa | Bulk SMS & Communication Solutions
  followup_body: |
    Hi Stephen,

    Just following up on my earlier email.

    I believe there could be a useful opportunity to integrate automated SMS notifications into GroundWork PM, particularly around tenant reminders, payment confirmations and property updates.

    I'm curious whether you're currently handling these notifications through an existing SMS provider or another communication channel.

    I'd be happy to have a short conversation and explore whether TalkSasa could complement what you're already doing.

    Would a quick call next week work for you?

    Best regards,
    Mary
    TalkSasa

