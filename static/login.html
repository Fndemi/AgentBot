<style>
:root {
  --app: #F7F7F8;
  --bg: #FDFDFD;
  --card: #FFFFFF;
  --hover: #F3F3F5;
  --nav-sel: #EDEDF0;
  --muted: #F1F1F3;
  --line: #EBEBED;
  --input: #DEDEE1;
  --fg: #1F1F23;
  --fg-2: #66656F;
  --fg-3: #6E6D77;
  --primary: #4A3AC2;
  --primary-hover: #3D2FA8;
  --primary-soft: #F1EFFC;
  --primary-line: #D9D3F7;
  --on-primary: #FFFFFF;
  --cyan: #16C8E8;
  --pos: #17784A;  --pos-bg: #E8F7EE;
  --info: #2563C8; --info-bg: #EAF1FB;
  --warn: #9A5B06; --warn-bg: #FDF5E2;
  --neg: #C2362F;  --neg-bg: #FCEBEA;
  --neu: #8A8992;  --neu-bg: #F1F1F3;
  --chart-sent: #D4D3D8;
  --chart-reply: #4A3AC2;
  --shadow-panel: 0 1px 2px rgba(20, 20, 30, .05), 0 0 0 1px rgba(20, 20, 30, .02);
  --shadow-pop: 0 12px 32px -12px rgba(20, 20, 30, .25), 0 2px 6px rgba(20, 20, 30, .06);
  --glow: radial-gradient(60% 120% at 0% 0%, rgba(74, 58, 194, .07), transparent 60%), radial-gradient(50% 120% at 100% 0%, rgba(22, 200, 232, .07), transparent 60%);
  --font: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --app: #111113; --bg: #161619; --card: #1C1C20; --hover: #232328; --nav-sel: #26262B; --muted: #26262B;
    --line: #2A2A2F; --input: #3A3A41; --fg: #F2F2F4; --fg-2: #B4B3BD; --fg-3: #9B9AA4;
    --primary: #A99CFF; --primary-hover: #BDB3FF; --primary-soft: #2A2547; --primary-line: #3E3670; --on-primary: #131316;
    --pos: #6FD9A0; --pos-bg: #173326; --info: #8FB8F5; --info-bg: #18294A;
    --warn: #F2C063; --warn-bg: #352A12; --neg: #F59A92; --neg-bg: #3A1C1B; --neu: #9B9AA4; --neu-bg: #26262B;
    --chart-sent: #3F3F46; --chart-reply: #A99CFF;
    --shadow-panel: inset 0 1px 0 rgba(255, 255, 255, .04);
    --shadow-pop: 0 16px 40px -12px rgba(0, 0, 0, .6);
    --glow: radial-gradient(60% 120% at 0% 0%, rgba(169, 156, 255, .12), transparent 60%), radial-gradient(50% 120% at 100% 0%, rgba(22, 200, 232, .07), transparent 60%);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --app: #111113; --bg: #161619; --card: #1C1C20; --hover: #232328; --nav-sel: #26262B; --muted: #26262B;
  --line: #2A2A2F; --input: #3A3A41; --fg: #F2F2F4; --fg-2: #B4B3BD; --fg-3: #9B9AA4;
  --primary: #A99CFF; --primary-hover: #BDB3FF; --primary-soft: #2A2547; --primary-line: #3E3670; --on-primary: #131316;
  --pos: #6FD9A0; --pos-bg: #173326; --info: #8FB8F5; --info-bg: #18294A;
  --warn: #F2C063; --warn-bg: #352A12; --neg: #F59A92; --neg-bg: #3A1C1B; --neu: #9B9AA4; --neu-bg: #26262B;
  --chart-sent: #3F3F46; --chart-reply: #A99CFF;
  --shadow-panel: inset 0 1px 0 rgba(255, 255, 255, .04);
  --shadow-pop: 0 16px 40px -12px rgba(0, 0, 0, .6);
  --glow: radial-gradient(60% 120% at 0% 0%, rgba(169, 156, 255, .12), transparent 60%), radial-gradient(50% 120% at 100% 0%, rgba(22, 200, 232, .07), transparent 60%);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body { margin: 0; background: var(--app); color: var(--fg); font-family: var(--font); font-size: 14px; line-height: 1.5;
  -webkit-font-smoothing: antialiased; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; border-radius: 4px; }
h1, p { margin: 0; }
.wrap { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--glow), var(--app); }
.card { width: 100%; max-width: 380px; background: var(--card); border: 1px solid var(--line); border-radius: 12px;
  box-shadow: var(--shadow-pop); padding: 28px; display: grid; gap: 20px; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand img { width: 30px; height: 30px; object-fit: contain; border-radius: 7px; background: #FFFFFF; padding: 2px; border: 1px solid var(--line); }
.brand b { display: block; font-size: 14px; font-weight: 600; line-height: 17px; }
.brand span { display: block; font-size: 12px; color: var(--fg-3); line-height: 15px; }
h1 { font-size: 20px; font-weight: 600; letter-spacing: -0.015em; }
.sub { color: var(--fg-2); font-size: 13px; margin-top: 4px; }
form { display: grid; gap: 14px; }
label { display: grid; gap: 6px; font-size: 13px; font-weight: 500; }
input { height: 38px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--input); background: var(--bg); }
input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
.hint { font-size: 12px; color: var(--fg-3); font-weight: 400; }
.btn { height: 38px; border-radius: 8px; border: 0; background: var(--primary); color: var(--on-primary); font-weight: 500; cursor: pointer; }
.btn:hover { background: var(--primary-hover); }
.btn[disabled] { opacity: .6; cursor: default; }
.err { background: var(--neg-bg); color: var(--neg); border-radius: 8px; padding: 9px 12px; font-size: 13px; }
.foot { font-size: 12px; color: var(--fg-3); text-align: center; }
</style>

    <section id="signin">
      <h1>Sign in</h1>
      <p class="sub">Use the account your admin set up for you.</p>
      <form id="f-signin" style="margin-top:18px" novalidate>
        <label>Email <input id="email" type="email" autocomplete="username" required autofocus></label>
        <label>Password <input id="password" type="password" autocomplete="current-password" required></label>
        <p class="err" id="e-signin" role="alert" hidden></p>
        <button class="btn" type="submit">Sign in</button>
      </form>
    </section>

    <section id="change" hidden>
      <h1>Set your password</h1>
      <p class="sub" id="change-sub">Choose a password only you know before you continue.</p>
      <form id="f-change" style="margin-top:18px" novalidate>
        <label>Current or temporary password <input id="cur" type="password" autocomplete="current-password" required></label>
        <label>New password <span class="hint">At least 10 characters.</span>
          <input id="new1" type="password" autocomplete="new-password" minlength="10" required></label>
        <label>New password again <input id="new2" type="password" autocomplete="new-password" required></label>
        <p class="err" id="e-change" role="alert" hidden></p>
        <button class="btn" type="submit">Save and continue</button>
      </form>
    </section>

    <p class="foot">Forgot your password? Ask an admin to reset it.</p>
  </main>
</div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const params = new URLSearchParams(location.search);
  const nextUrl = (() => {
    const n = params.get("next") || "/crm";
    return n.startsWith("/") && !n.startsWith("//") && n !== "/login" ? n : "/crm";
  })();

  async function post(url, body) {
    const r = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" },
      credentials: "same-origin", body: JSON.stringify(body) });
    let data = {};
    try { data = await r.json(); } catch (e) {}
    if (!r.ok) throw new Error(typeof data.detail === "string" ? data.detail : "Something went wrong. Try again.");
    return data;
  }
  // Sales can't open the dashboard, so they always land in the CRM
  let role = null;
  const dest = () => role === "admin" || nextUrl.startsWith("/crm") ? nextUrl : "/crm";

  function showErr(el, msg) { el.textContent = msg; el.hidden = !msg; }
  function showChange() { $("signin").hidden = true; $("change").hidden = false; $("cur").focus(); }

  // Already signed in? Go straight on, or finish setting the password.
  fetch("/api/auth/me", { credentials: "same-origin" }).then(r => r.ok ? r.json() : null).then(d => {
    if (!d) return;
    role = d.user.role;
    if (d.user.must_change) showChange(); else location.replace(dest());
  }).catch(() => {});

  $("f-signin").addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = e.submitter || e.target.querySelector("button");
    showErr($("e-signin"), "");
    const email = $("email").value.trim(), password = $("password").value;
    if (!email || !password) return showErr($("e-signin"), "Enter your email and password.");
    btn.disabled = true;
    try {
      const d = await post("/api/auth/login", { email, password });
      role = d.user.role;
      if (d.must_change) { $("cur").value = password; showChange(); $("new1").focus(); }
      else location.replace(dest());
    } catch (err) { showErr($("e-signin"), err.message); $("password").select(); }
    finally { btn.disabled = false; }
  });

  $("f-change").addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = e.submitter || e.target.querySelector("button");
    showErr($("e-change"), "");
    if ($("new1").value.length < 10) return showErr($("e-change"), "Use at least 10 characters.");
    if ($("new1").value !== $("new2").value) return showErr($("e-change"), "The two new passwords don't match.");
    btn.disabled = true;
    try {
      await post("/api/auth/password", { current: $("cur").value, new: $("new1").value });
      location.replace(dest());
    } catch (err) { showErr($("e-change"), err.message); }
    finally { btn.disabled = false; }
  });
})();
</script>
