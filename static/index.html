<title>TalkSasa LeadBot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* ==========================================================================
   LeadBot v4 — the Lovable prototype's look, wired to the real LeadBot API.
   Layout: 240px sidebar on a soft backdrop; the work sits in one framed
   panel with a sticky top bar. Violet = action, selection, replies only.
   ========================================================================== */
:root {
  --app: #F7F7F8;
  --bg: #FDFDFD;
  --card: #FFFFFF;
  --hover: #F3F3F5;
  --nav-sel: #EDEDF0;
  --muted: #F1F1F3;
  --line: #E3E3E8;
  --input: #D0D0D6;
  --fg: #1F1F23;
  --fg-2: #5A5963;
  --fg-3: #686771;
  --primary: #4A3AC2;
  --primary-hover: #3D2FA8;
  --primary-soft: #F1EFFC;
  --primary-line: #D9D3F7;
  --on-primary: #FFFFFF;
  --cyan: #16C8E8;
  --pos: #17784A;  --pos-bg: #E8F7EE;
  --info: #2563C8; --info-bg: #EAF1FB;
  --warn: #9A5B06; --warn-bg: #FDF5E2;
  --neg: #C2362F;  --neg-bg: #FCEBEA;
  --neu: #63626C;  --neu-bg: #EEEEF1;
  --chart-sent: #C6C5CD;
  --chart-reply: #4A3AC2;
  --shadow-panel: 0 1px 2px rgba(20, 20, 30, .05), 0 8px 20px -14px rgba(20, 20, 30, .18);
  --shadow-pop: 0 12px 32px -12px rgba(20, 20, 30, .25), 0 2px 6px rgba(20, 20, 30, .06);
  --glow: radial-gradient(60% 120% at 0% 0%, rgba(74, 58, 194, .07), transparent 60%), radial-gradient(50% 120% at 100% 0%, rgba(22, 200, 232, .07), transparent 60%);
  --font: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --app: #111113; --bg: #161619; --card: #1C1C20; --hover: #232328; --nav-sel: #26262B; --muted: #26262B;
    --line: #2A2A2F; --input: #3A3A41; --fg: #F2F2F4; --fg-2: #B4B3BD; --fg-3: #9B9AA4;
    --primary: #A99CFF; --primary-hover: #BDB3FF; --primary-soft: #2A2547; --primary-line: #3E3670; --on-primary: #131316;
    --pos: #6FD9A0; --pos-bg: #173326; --info: #8FB8F5; --info-bg: #18294A;
    --warn: #F2C063; --warn-bg: #352A12; --neg: #F59A92; --neg-bg: #3A1C1B; --neu: #9B9AA4; --neu-bg: #26262B;
    --chart-sent: #3F3F46; --chart-reply: #A99CFF;
    --shadow-panel: inset 0 1px 0 rgba(255, 255, 255, .04);
    --shadow-pop: 0 16px 40px -12px rgba(0, 0, 0, .6);
    --glow: radial-gradient(60% 120% at 0% 0%, rgba(169, 156, 255, .12), transparent 60%), radial-gradient(50% 120% at 100% 0%, rgba(22, 200, 232, .07), transparent 60%);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --app: #111113; --bg: #161619; --card: #1C1C20; --hover: #232328; --nav-sel: #26262B; --muted: #26262B;
  --line: #2A2A2F; --input: #3A3A41; --fg: #F2F2F4; --fg-2: #B4B3BD; --fg-3: #9B9AA4;
  --primary: #A99CFF; --primary-hover: #BDB3FF; --primary-soft: #2A2547; --primary-line: #3E3670; --on-primary: #131316;
  --pos: #6FD9A0; --pos-bg: #173326; --info: #8FB8F5; --info-bg: #18294A;
  --warn: #F2C063; --warn-bg: #352A12; --neg: #F59A92; --neg-bg: #3A1C1B; --neu: #9B9AA4; --neu-bg: #26262B;
  --chart-sent: #3F3F46; --chart-reply: #A99CFF;
  --shadow-panel: inset 0 1px 0 rgba(255, 255, 255, .04);
  --shadow-pop: 0 16px 40px -12px rgba(0, 0, 0, .6);
  --glow: radial-gradient(60% 120% at 0% 0%, rgba(169, 156, 255, .12), transparent 60%), radial-gradient(50% 120% at 100% 0%, rgba(22, 200, 232, .07), transparent 60%);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body { margin: 0; background: var(--app); color: var(--fg); font-family: var(--font); font-size: 14px; line-height: 1.5;
  letter-spacing: -0.005em; -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; letter-spacing: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; border-radius: 4px; }
h1, h2, h3, p { margin: 0; }
a { color: inherit; text-decoration: none; }
svg.i { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
svg.i.sm { width: 14px; height: 14px; }
.tnum { font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.kbd { display: inline-flex; align-items: center; justify-content: center; min-width: 18px; height: 18px; padding: 0 4px; border-radius: 4px;
  border: 1px solid var(--line); background: var(--card); font-family: var(--mono); font-size: 10.5px; color: var(--fg-2); }
.panel { background: var(--card); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow-panel); min-width: 0; }

/* ---------- sidebar ---------- */
.side { position: fixed; inset: 0 auto 0 0; width: 240px; padding: 16px 12px; display: flex; flex-direction: column; gap: 20px; }
.brand { display: flex; align-items: center; gap: 10px; padding: 0 8px; }
.brand img { width: 32px; height: 32px; object-fit: contain; border-radius: 8px; background: #FFFFFF; padding: 2px; border: 1px solid var(--line); }
.brand b { display: block; font-size: 14px; font-weight: 600; line-height: 17px; }
.brand span { display: block; font-size: 11px; color: var(--fg-3); line-height: 14px; }
.searchbtn { display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 10px; border-radius: 6px; border: 1px solid var(--line);
  background: var(--card); color: var(--fg-3); font-size: 13px; box-shadow: var(--shadow-panel); width: 100%; text-align: left; }
.searchbtn:hover { color: var(--fg); }
.searchbtn .kbd { margin-left: auto; }
.nav { display: grid; gap: 2px; }
.navlink { display: flex; align-items: center; gap: 10px; height: 32px; padding: 0 8px; border-radius: 6px; font-size: 13px; font-weight: 500; color: var(--fg-2); }
.navlink svg { color: var(--fg-3); }
.navlink:hover { background: var(--hover); color: var(--fg); }
.navlink[aria-current="page"] { background: var(--nav-sel); color: var(--fg); }
.navlink[aria-current="page"] svg { color: var(--fg); }
.navlink .badge { margin-left: auto; }
.navlink.signout { width: 100%; border: 0; background: transparent; text-align: left; }
.navlink .keys { margin-left: auto; display: none; gap: 2px; opacity: 0; transition: opacity .15s; }
.navlink:hover .keys { opacity: 1; }
@media (min-width: 1280px) { .navlink .keys { display: inline-flex; } }
.badge { border-radius: 999px; background: var(--primary); color: var(--on-primary); font-size: 11px; font-weight: 600; line-height: 18px; padding: 0 6px; }
.side-foot { margin-top: auto; display: grid; gap: 10px; }
.me { display: flex; align-items: center; gap: 10px; padding: 10px 8px 2px; border-top: 1px solid var(--line); }
.me .av { flex: none; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 600;
  background: var(--primary-soft); color: var(--primary); border: 1px solid var(--primary-line); }
.me b { display: block; font-size: 13px; font-weight: 600; line-height: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.me span { display: block; font-size: 11.5px; color: var(--fg-3); line-height: 15px; }
.me > div { min-width: 0; }
.eyebrow { padding: 0 8px; font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: .06em; color: var(--fg-3); }
.botcard { padding: 12px; display: grid; gap: 12px; }
/* the bot's status card at the foot of the sidebar: brand purple, like the sign-in page's panel */
.botcard.brandcard { position: relative; overflow: hidden; padding: 14px; gap: 8px; border: 0; border-radius: 12px; color: #FFFFFF;
  background: radial-gradient(80% 60% at 100% 0%, rgba(22, 200, 232, .35), transparent 62%), linear-gradient(155deg, #5443D6 0%, #3A2CA3 60%, #261C73 100%);
  box-shadow: 0 12px 24px -16px rgba(58, 44, 163, .9); }
.brandcard::after { content: ""; position: absolute; right: -40px; bottom: -40px; width: 120px; height: 120px; border-radius: 50%;
  border: 1px solid rgba(255, 255, 255, .14); box-shadow: 0 0 0 18px rgba(255, 255, 255, .04); pointer-events: none; }
.bc-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.bc-name { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: rgba(255, 255, 255, .72); }
.bc-pill { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 9px; border-radius: 999px; min-width: 0;
  background: rgba(255, 255, 255, .15); font-size: 11.5px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bc-when { font-size: 11.5px; color: rgba(255, 255, 255, .72); }
.bc-sent { position: relative; z-index: 1; display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-top: 6px;
  font-size: 12px; color: rgba(255, 255, 255, .82); }
.bc-sent b { font-size: 22px; font-weight: 600; line-height: 26px; letter-spacing: -.02em; color: #FFFFFF; }
.bc-sent small { font-size: 12px; font-weight: 500; color: rgba(255, 255, 255, .72); letter-spacing: 0; }
.bc-bar { position: relative; z-index: 1; height: 6px; border-radius: 999px; background: rgba(255, 255, 255, .2); overflow: hidden; }
.bc-bar span { display: block; height: 100%; border-radius: 999px; background: #FFFFFF; }
.bc-left { position: relative; z-index: 1; font-size: 11.5px; color: rgba(255, 255, 255, .72); }
.botrow { display: flex; align-items: center; gap: 8px; font-size: 12px; }
.botrow b { font-weight: 500; }
.botrow .when { margin-left: auto; color: var(--fg-3); }
.pulse { position: relative; width: 8px; height: 8px; flex: none; }
.pulse i { position: absolute; inset: 0; border-radius: 50%; background: var(--c, var(--pos)); }
.pulse.live i:first-child { animation: ping 1.6s cubic-bezier(0, 0, .2, 1) infinite; opacity: .5; }
@keyframes ping { 75%, 100% { transform: scale(2.2); opacity: 0; } }
.bar { height: 4px; border-radius: 999px; background: var(--muted); overflow: hidden; }
.bar span { display: block; height: 100%; border-radius: 999px; background: var(--primary); }

/* ---------- frame ---------- */
.shell { padding: 8px 8px 8px 240px; min-height: 100vh; }
.frame { background: var(--bg); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow-panel); min-height: calc(100vh - 16px); }
.topbar { position: sticky; top: 0; z-index: 20; height: 48px; display: flex; align-items: center; gap: 12px; padding: 0 24px;
  border-bottom: 1px solid var(--line); background: color-mix(in srgb, var(--bg) 85%, transparent); backdrop-filter: blur(8px); border-radius: 12px 12px 0 0; }
.crumb { display: flex; align-items: center; gap: 6px; font-size: 13px; }
.crumb span { color: var(--fg-3); }
.crumb b { font-weight: 500; }
.fresh { font-size: 12px; color: var(--fg-3); white-space: nowrap; }
.fresh.bad { color: var(--neg); }
.topbar .right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.samplebadge { border: 1px dashed var(--input); border-radius: 4px; padding: 1px 6px; font-size: 11px; font-weight: 500; color: var(--fg-2); white-space: nowrap; }
.topsearch { width: 220px; }
.iconbtn { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 6px; border: 0; background: transparent; color: var(--fg-2); }
.iconbtn:hover { background: var(--hover); color: var(--fg); }
main.page { width: 100%; max-width: 1280px; margin: 0 auto; padding: 32px; }
.mhead { display: none; }

/* ---------- controls ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 40px; padding: 0 14px; border-radius: 6px;
  border: 1px solid var(--input); background: var(--card); color: var(--fg); font-size: 14px; font-weight: 500; white-space: nowrap; transition: background .15s, border-color .15s; }
.btn:hover:not(:disabled) { background: var(--hover); }
.btn.primary { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
.btn.primary:hover:not(:disabled) { background: var(--primary-hover); border-color: var(--primary-hover); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--fg-2); }
.btn.ghost:hover:not(:disabled) { background: var(--hover); color: var(--fg); }
.btn.sm { height: 32px; padding: 0 10px; font-size: 13px; }
.btn:disabled { opacity: .6; cursor: not-allowed; }
.spin { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.field { height: 40px; width: 100%; border: 1px solid var(--input); background: var(--card); border-radius: 6px; padding: 0 12px; font-size: 14px; min-width: 0; }
.field::placeholder { color: var(--fg-3); }
.withicon { position: relative; display: block; }
.withicon svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--fg-3); pointer-events: none; }
.withicon .field { padding-left: 36px; }
.textlink { display: inline-flex; align-items: center; gap: 4px; color: var(--primary); font-size: 13px; font-weight: 500; background: none; border: 0; padding: 0; }
.textlink:hover { text-decoration: underline; }

/* ---------- tags ---------- */
.tag { display: inline-flex; align-items: center; gap: 6px; border-radius: 4px; font-size: 12px; font-weight: 500; white-space: nowrap; line-height: 18px; }
.tag i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex: none; }
.tag.tint { padding: 1px 6px; }
.tag.plain { color: var(--fg); }
.tag.plain i { background: var(--c); }
.t-pos { --c: var(--pos); } .t-info { --c: var(--info); } .t-warn { --c: var(--warn); } .t-neg { --c: var(--neg); } .t-neu { --c: var(--neu); } .t-pri { --c: var(--primary); }
.tag.tint.t-pos { background: var(--pos-bg); color: var(--pos); }
.tag.tint.t-info { background: var(--info-bg); color: var(--info); }
.tag.tint.t-warn { background: var(--warn-bg); color: var(--warn); }
.tag.tint.t-neg { background: var(--neg-bg); color: var(--neg); }
.tag.tint.t-neu { background: var(--neu-bg); color: var(--fg-2); }
.tag.tint.t-neu i { background: var(--neu); }

/* ---------- page parts ---------- */
.pagehead { margin-bottom: 32px; }
.pagehead h1 { font-size: 26px; font-weight: 600; letter-spacing: -0.02em; line-height: 32px; }
.pagehead p { margin-top: 4px; color: var(--fg-2); }
.shead { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 12px; flex-wrap: wrap; }
.shead h2 { font-size: 18px; font-weight: 600; line-height: 24px; letter-spacing: -0.01em; }
.shead p { font-size: 13px; color: var(--fg-2); }
.stack { display: grid; gap: 48px; }
.stack > *, .split > *, section { min-width: 0; }
.notice { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; border-radius: 8px; padding: 12px 16px; border: 1px solid; }
.notice.warn { background: var(--warn-bg); border-color: color-mix(in srgb, var(--warn) 30%, transparent); }
.notice.neg { background: var(--neg-bg); border-color: color-mix(in srgb, var(--neg) 30%, transparent); }
.notice svg { color: var(--warn); }
.notice.neg svg { color: var(--neg); }
.notice .txt { flex: 1; min-width: 220px; }
.notice b { display: block; font-weight: 500; }
.notice span { font-size: 13px; color: var(--fg-2); }
.notice code { font-family: var(--mono); font-size: 12px; background: var(--card); padding: 1px 5px; border-radius: 4px; border: 1px solid var(--line); overflow-wrap: anywhere; }
.empty { padding: 48px 24px; text-align: center; }
.empty b { display: block; font-size: 15px; font-weight: 500; }
.empty p { margin: 4px auto 0; max-width: 380px; font-size: 13px; color: var(--fg-2); }
.empty code { font-family: var(--mono); font-size: 12px; background: var(--muted); padding: 1px 5px; border-radius: 4px; }
.sk { background: var(--muted); border-radius: 4px; animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .55; } }

/* hero */
.hero { margin: -32px -32px 0; padding: 40px 32px 32px; border-bottom: 1px solid var(--line); background-image: var(--glow); }
.hero .date { font-size: 13px; font-weight: 500; color: var(--fg-3); }
.hero h1 { margin-top: 4px; font-size: 32px; font-weight: 600; letter-spacing: -0.025em; line-height: 38px; }
.hero p { margin-top: 6px; max-width: 600px; color: var(--fg-2); }
.hero p b { color: var(--fg); font-weight: 600; }
.hero .cta { margin-top: 20px; display: flex; gap: 8px; flex-wrap: wrap; }

/* needs reply */
.qlist { list-style: none; margin: 0; padding: 0; }
.qlist li + li { border-top: 1px solid var(--line); }
.qrow { display: grid; grid-template-columns: 220px 120px minmax(0, 1fr) 80px 16px; align-items: center; gap: 4px 16px; padding: 14px 20px; transition: background .15s; }
.qrow:hover { background: var(--hover); }
.qrow .who { display: flex; align-items: center; gap: 8px; min-width: 0; }
.qrow .who b { font-weight: 600; }
.qrow .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--primary); flex: none; }
.qrow .sum { color: var(--fg-2); }
.qrow time { text-align: right; font-size: 13px; color: var(--fg-3); }
.qrow svg { color: var(--fg-3); }
.qrow:hover svg { color: var(--fg); }

/* KPI cards */
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.kpi { padding: 20px; display: flex; flex-direction: column; }
.kpi .lbl { font-size: 12px; font-weight: 500; color: var(--fg-2); }
.kpi .val { margin-top: 8px; font-size: 28px; font-weight: 600; line-height: 36px; letter-spacing: -0.02em; }
.kpi .hint { margin-top: 4px; font-size: 12px; line-height: 1.4; color: var(--fg-3); }
.kpi .hint.warn { color: var(--warn); }
.kpi .hint.neg { color: var(--neg); }
.kpi .spark { margin-top: auto; padding-top: 12px; }
.kpi .spark svg { display: block; width: 100%; height: 28px; }
.kpi .spark small { display: block; font-size: 11px; color: var(--fg-3); margin-top: 2px; }
.kpi .meter { margin-top: auto; padding-top: 14px; }

/* summary cards under the greeting: one headline number each */
.tiles { margin-top: 28px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.tile { display: flex; flex-direction: column; gap: 4px; padding: 18px 20px; color: inherit; text-decoration: none;
  transition: border-color .15s, box-shadow .15s, transform .15s; }
a.tile:hover { border-color: var(--primary-line); box-shadow: var(--shadow-pop); transform: translateY(-1px); }
.tile .top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.tile .lbl { font-size: 13px; font-weight: 500; color: var(--fg-2); }
.tile .ic { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; flex: none;
  background: var(--primary-soft); color: var(--primary); }
.tile .val { margin-top: 6px; font-size: 32px; font-weight: 600; line-height: 38px; letter-spacing: -0.025em; color: var(--fg); }
.tile .val small { font-size: 16px; font-weight: 500; color: var(--fg-3); letter-spacing: 0; }
.tile .hint { font-size: 12.5px; line-height: 1.4; color: var(--fg-3); }
.tile .track { margin-top: 8px; height: 6px; border-radius: 999px; background: var(--primary-soft); overflow: hidden; }
.tile .track span { display: block; height: 100%; border-radius: 999px; background: var(--primary); }
@media (max-width: 1180px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 400px) { .tile { padding: 14px 16px; } .tile .val { font-size: 26px; line-height: 32px; } }

/* activity + pipeline */
.split { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 40px; align-items: start; }
.legend { display: flex; gap: 16px; font-size: 13px; color: var(--fg-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend b { font-weight: 600; color: var(--fg); }
.sw { width: 8px; height: 8px; border-radius: 2px; flex: none; }
.chartpanel { padding: 16px 20px 12px; }
.series + .series { margin-top: 14px; }
.series .sh { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--fg-3); margin-bottom: 4px; }
.series .sh b { font-weight: 500; color: var(--fg-2); }
.chartbox svg { display: block; width: 100%; }
.tip { position: absolute; z-index: 5; pointer-events: none; background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow-pop);
  border-radius: 6px; padding: 8px 12px; font-size: 13px; min-width: 170px; }
.tip .r { display: flex; justify-content: space-between; gap: 12px; align-items: center; color: var(--fg-2); }
.tip .r b { color: var(--fg); }
.pgroup { padding: 16px 20px; }
.pgroup + .pgroup { border-top: 1px solid var(--line); }

/* ========================= state ========================= */

};

/* ======================== helpers ======================== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pct = (a, b) => (b ? (a / b) * 100 : null);
const fmtPct = v => v == null ? "–" : `${v.toFixed(1)}%`;
const fmtNum = n => Number(n || 0).toLocaleString("en-KE");
const toDate = s => s ? new Date(s.length === 10 ? s + "T00:00:00" : s) : null;
function ago(d) {
  if (!d) return "";
  const m = Math.round((Date.now() - d) / 60000);
  if (m < 1) return "just now";
  if (m < 60) return `${m}m ago`;
  const h = Math.round(m / 60); if (h < 24) return `${h}h ago`;
  const days = Math.round(h / 24); if (days === 1) return "yesterday";
  return days < 7 ? `${days}d ago` : d.toLocaleDateString("en-KE", { day: "numeric", month: "short" });
}
const clock = d => d.toLocaleTimeString("en-KE", { hour: "2-digit", minute: "2-digit" });
const shortDate = d => d.toLocaleDateString("en-KE", { day: "numeric", month: "short" });
const fullDate = d => d.toLocaleString("en-KE", { weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
const tag = (key, map = LABEL, tint = true) => { const v = map[key] || { text: key || "Unknown", tone: "neu" }; return `<span class="tag ${tint ? "tint" : "plain"} t-${v.tone}"><i></i>${esc(v.text)}</span>`; };
const statusTag = k => tag(k, STATUS, false);
const leadById = id => S.data?.leads.find(l => l.id === id);
const replyById = id => S.data?.replies.find(r => r.id === id);
const isTyping = el => !!el && (/^(INPUT|SELECT|TEXTAREA)$/.test(el.tagName) || el.isContentEditable);
const mobile = () => window.matchMedia("(max-width: 1023px)").matches;

/* ======================== theme ======================== */
function currentTheme() {
  const set = document.documentElement.dataset.theme;
  return set || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
}
function applyStoredTheme() { try { const t = localStorage.getItem("leadbot-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {} }
function toggleTheme() {
  const next = currentTheme() === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem("leadbot-theme", next); } catch (e) {}
  renderChrome(); if (S.view === "today" && S.data) drawActivity();
}

/* ========================= data ========================= */
async function getJSON(url, opts = {}) {
  const ctl = new AbortController(); const timer = setTimeout(() => ctl.abort(), 10000);
  try {
    const r = await fetch(url, { ...opts, signal: ctl.signal, cache: "no-store" });
    if (r.status === 401) { location.href = "/login"; throw new Error("Please sign in."); }
    const json = (r.headers.get("content-type") || "").includes("json");
    const body = json ? await r.json() : null;
    if (!r.ok || !json) throw new Error(body?.detail || `the server answered ${r.status}`);
    return body;
  } finally { clearTimeout(timer); }
}
async function signOut() {
  try { await fetch("/api/auth/logout", { method: "POST", cache: "no-store" }); } catch (e) {}
  location.href = "/login";
}
function normalise(d) {
  d.replies = d.replies || []; d.leads = d.leads || [];
  d.replies.forEach(r => { r.handled = !!r.handled; r._d = toDate(r.received_at); });
  d.leads.forEach(l => { l._last = toDate(l.last); });
  d.daily = d.daily || []; d.niches = d.niches || []; d.statusCounts = d.statusCounts || {}; d.bot = d.bot || {};
  return d;
}
async function refresh({ manual = false } = {}) {
  if (S.refreshing || S.pending) return;
  S.refreshing = true; renderChrome();
  try {
    S.data = normalise(await getJSON("api/all")); S.mode = "live"; S.lastOk = new Date(); S.refreshError = false;
    try { S.sentToday = (await getJSON("api/sent-today")).emails; } catch (e) { S.sentToday = null; }
    const open = [S.org.id, ...S.sentOpen].filter(x => x != null);
    S.tl = Object.fromEntries(Object.entries(S.tl).filter(([k]) => open.includes(+k)));
    open.forEach(id => loadTimeline(id, { silent: true, force: true }));
    if (manual) toast("Data refreshed");
  } catch (e) {
    if (S.mode === "live") S.refreshError = true;
    else { S.data = normalise(demoData()); S.mode = "demo"; S.lastOk = new Date(); S.sentToday = demoSentToday(); }
  } finally { S.refreshing = false; render(); }
}
function busy() { const s = window.getSelection ? String(window.getSelection()) : ""; return S.pending || isTyping(document.activeElement) || s.length > 0 || S.cmdk.open; }

/* ===================== email history ===================== */
async function loadTimeline(id, { silent = false, force = false } = {}) {
  const cur = S.tl[id];
  if (!force && cur && (cur.state === "ok" || cur.state === "loading")) return;

function neighbour(id) { const l = filteredReplies(), i = l.findIndex(r => r.id === id); return i < 0 ? null : (l[i + 1] || l[i - 1] || null)?.id ?? null; }
async function runAction(kind, r, fn) {
  if (S.pending) return;
  S.pending = { kind, id: r.id }; S.actionError = null; S.actionOk = null; render();
  const next = neighbour(r.id);
  try {
    const msg = await fn();
    const note = S.mode === "demo" ? `${msg} (example data, not saved)` : msg;
    if (S.replies.tab === "action" && !needsAction(r) && next != null) { S.replies.selected = next; toast(note); }
    else S.actionOk = { id: r.id, msg: note };
  } catch (e) {

    S.actionError = { id: r.id, msg: `${why.charAt(0).toUpperCase() + why.slice(1)}. Nothing else was changed. Check the API is running, then try again.` };
  } finally { S.pending = null; render(); }
}
const setHandled = (r, v) => runAction("handled", r, async () => {
  await post(`api/replies/${r.id}/handled`, { handled: v }); r.handled = v;

function setLeadStatus(r, status) {
  const lead = leadById(r.lead_id); if (!lead) return;
  return runAction(status, r, async () => {
    const old = lead.status;
    await post(`api/leads/${lead.id}/status`, { status });
    lead.status = status;
    S.data.statusCounts[old] = Math.max(0, (S.data.statusCounts[old] || 0) - 1);
    S.data.statusCounts[status] = (S.data.statusCounts[status] || 0) + 1;
    if (!r.handled) {
      try { await post(`api/replies/${r.id}/handled`, { handled: true }); r.handled = true; }
      catch (e) { throw new Error(`${lead.company} was saved as "${STATUS[status].text}", but the reply couldn't be marked handled (${e.message}). Use Mark handled to finish`); }
    }
    return `Lead status set to ${STATUS[status].text}`;
  });
}

function th(scope, key, text, right) {

function renderIndustries() {
  const rows = S.data.niches.map(n => ({ ...n, name: industryName(n.industry), reach: n.delivered, rate: pct(n.replies, n.delivered) }));
  if (!rows.length) return `<div class="empty"><b>No industry data yet</b><p>Industries appear once organisations are discovered.</p></div>`;
  const { sort, dir } = S.ind;
  rows.sort((a, b) => {
    if (sort === "rate" && (a.reach < SMALL_SAMPLE) !== (b.reach < SMALL_SAMPLE)) return a.reach < SMALL_SAMPLE ? 1 : -1;
    const v = r => sort === "name" ? r.name.toLowerCase() : sort === "rate" ? (r.rate ?? -1) : r[sort];
    return (v(a) < v(b) ? -1 : v(a) > v(b) ? 1 : 0) * (dir === "asc" ? 1 : -1);
  });
  const max = Math.max(1, ...rows.filter(r => r.reach >= SMALL_SAMPLE).map(r => r.rate || 0));
  return `<table style="min-width:680px"><thead><tr>${th("ind", "name", "Industry")}${th("ind", "leads", "Organisations", 1)}${th("ind", "reach", "Reachable", 1)}${th("ind", "replies", "Replies", 1)}${th("ind", "rate", "Reply rate")}${th("ind", "interested", "Interested", 1)}</tr></thead>

      <td class="r" style="font-weight:500">${fmtNum(r.interested)}</td></tr>`).join("")}</tbody></table>`;
}
function drawActivity() {
  const host = $("#activity"); if (!host) return;
  const daily = S.data.daily;
  if (!daily.some(d => d.sent || d.replies)) { host.innerHTML = `<div class="empty"><b>No activity yet</b><p>Daily emails and replies will chart here once outreach begins. Send a batch with <code>python main.py send</code>.</p></div>`; return; }
  const W = Math.max(240, host.clientWidth), H = 100, L = 30, R = 2, T = 6, B = 2, AX = 22, n = daily.length, iw = (W - L - R) / n, bw = Math.max(2, Math.min(14, iw - 3));
  const nice = m => { const s = m <= 4 ? 1 : m <= 10 ? 2 : m <= 25 ? 5 : m <= 50 ? 10 : 25; return Math.max(s, Math.ceil(m / s) * s); };
  const font = `font-size="11" fill="var(--fg-3)" font-family="var(--font)"`;
  const row = (key, color, axis, h0) => {
    const top = nice(Math.max(1, ...daily.map(d => d[key]))), h = h0 + (axis ? AX : 0), y = v => T + (h0 - T - B) * (1 - v / top);
    let s = `<svg width="${W}" height="${h}" viewBox="0 0 ${W} ${h}" aria-hidden="true">`;
    [top, top / 2].forEach(v => { s += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/>`; });
    s += `<line x1="${L}" x2="${W - R}" y1="${y(0)}" y2="${y(0)}" stroke="var(--input)"/>`;
    [0, top].forEach(v => { s += `<text x="${L - 8}" y="${y(v) + 4}" text-anchor="end" ${font}>${v}</text>`; });
    daily.forEach((d, i) => { if (!d[key]) return; const x = L + i * iw + (iw - bw) / 2, yt = y(d[key]), r = Math.min(2, (y(0) - yt) / 2);
      s += `<path d="M${x},${y(0)} V${yt + r} Q${x},${yt} ${x + r},${yt} H${x + bw - r} Q${x + bw},${yt} ${x + bw},${yt + r} V${y(0)} Z" fill="${color}"/>`; });
    if (axis) [0, 7, 14, 21, n - 1].filter(i => i < n).forEach(i => { const a = i === 0 ? "start" : i === n - 1 ? "end" : "middle", x = i === 0 ? L : i === n - 1 ? W - R : L + i * iw + iw / 2;
      s += `<text x="${x}" y="${h0 + 16}" text-anchor="${a}" ${font}>${shortDate(toDate(daily[i].day))}</text>`; });
    return s + `<rect class="xh" x="0" y="${T}" width="${Math.max(2, iw - 1)}" height="${y(0) - T}" fill="var(--hover)" visibility="hidden"/></svg>`;
  };
  host.innerHTML = `<div class="series"><div class="sh"><b>Emails sent per day</b><span>including follow-ups</span></div><div class="chartbox">${row("sent", "var(--chart-sent)", false, 110)}</div></div>
    <div class="series"><div class="sh"><b>Replies per day</b><span>excluding bounces and auto-replies</span></div><div class="chartbox">${row("replies", "var(--chart-reply)", true, 70)}</div></div>
    <div class="tip" hidden></div>
    <table class="sr"><caption>Emails sent and replies per day</caption><thead><tr><th>Day</th><th>Sent</th><th>Replies</th></tr></thead><tbody>${daily.map(d => `<tr><td>${d.day}</td><td>${d.sent}</td><td>${d.replies}</td></tr>`).join("")}</tbody></table>`;
  const tip = host.querySelector(".tip"), svgs = [...host.querySelectorAll("svg")];
  svgs.forEach(s => s.querySelector(".xh").parentNode.insertBefore(s.querySelector(".xh"), s.querySelector("line").nextSibling));
  const move = e => {
    const rect = svgs[0].getBoundingClientRect(), i = Math.max(0, Math.min(n - 1, Math.floor((e.clientX - rect.left - L) / iw))), d = daily[i];
    svgs.forEach(s => { const x = s.querySelector(".xh"); x.setAttribute("x", L + i * iw); x.setAttribute("visibility", "visible"); });
    tip.innerHTML = `<p style="font-weight:500;margin-bottom:4px">${toDate(d.day).toLocaleDateString("en-KE", { weekday: "short", day: "numeric", month: "short" })}</p>
      <div class="r"><span>Sent</span><b class="tnum">${d.sent}</b></div><div class="r"><span>Replies</span><b class="tnum" style="color:var(--primary)">${d.replies}</b></div>`;
    tip.hidden = false;
    const hr = host.getBoundingClientRect(); let left = rect.left - hr.left + L + i * iw + iw + 10;
    if (left + 180 > hr.width) left -= 200 + iw;
    tip.style.left = Math.max(0, left) + "px"; tip.style.top = "20px";
  };
  const leave = () => { tip.hidden = true; svgs.forEach(s => s.querySelector(".xh").setAttribute("visibility", "hidden")); };
  svgs.forEach(s => { s.addEventListener("pointermove", move); s.addEventListener("pointerleave", leave); });
}

      ${!D.leads.length ? `<div class="empty"><b>No organisations yet</b><p>Find your first leads with <code>python main.py discover sacco --max 10</code>.</p></div>`
      : !rows.length ? `<div class="empty"><b>No organisations match</b><p>Try clearing a filter or searching a different name.</p></div>`
      : `<div class="tscroll"><table><thead><tr>${th("orgs", "company", "Organisation")}${th("orgs", "industry", "Industry")}${th("orgs", "status", "Lead status")}${th("orgs", "step", "Outreach sequence")}${th("orgs", "last", "Last activity")}<th><span class="sr">Reply</span></th></tr></thead>
        <tbody>${rows.map(l => `<tr class="orgrow" data-org="${l.id}" tabindex="0" aria-label="Open ${esc(l.company)}"><td><div class="orgcell"><b class="truncate" title="${esc(l.company)}">${esc(l.company)}</b><span class="truncate" title="${esc(l.email)}">${esc(l.email)}</span></div></td>
          <td style="color:var(--fg-2)">${esc(industryName(l.industry))}</td><td>${statusTag(l.status)}</td><td style="padding-block:10px">${seqHTML(l)}</td>
          <td class="tnum" style="font-size:13px;color:var(--fg-2)">${l._last ? ago(l._last) : ""}</td>
          <td class="r">${latest.has(l.id) ? `<a class="textlink" href="#replies-${latest.get(l.id)}">View reply ${ico("arrowR", "sm")}</a>` : ""}</td></tr>`).join("")}</tbody></table></div>
        <ul class="cards">${rows.map(l => `<li class="orgrow" data-org="${l.id}"><div class="l1"><div><b class="truncate">${esc(l.company)}</b><span class="truncate">${esc(l.email)}</span></div>${statusTag(l.status)}</div>
          <div class="l2">${seqHTML(l)}<span class="tnum">${esc(industryName(l.industry))} · ${l._last ? ago(l._last) : ""}</span></div>
          ${latest.has(l.id) ? `<a class="btn viewreply" href="#replies-${latest.get(l.id)}">View reply</a>` : ""}</li>`).join("")}</ul>`}
    </div>`;
}

/* ===================== command palette ===================== */
function cmdItems() {
  const D = S.data, items = [];
  NAV.forEach(n => items.push({ grp: "Go to", icon: n.icon, text: n.label, meta: `G ${n.key}`, run: () => { location.hash = n.view; } }));
  if (D) {
    D.replies.filter(needsAction).forEach(r => items.push({ grp: "Replies needing action", icon: "inbox", text: r.company || r.from_email, meta: LABEL[r.label].text, find: r.summary, run: () => { location.hash = "replies-" + r.id; } }));
    D.leads.forEach(l => items.push({ grp: "Organisations", icon: "building", text: l.company, meta: industryName(l.industry), find: l.email, run: () => openOrg(l.id) }));
  }
  items.push({ grp: "Actions", icon: "refresh", text: "Refresh data", run: () => refresh({ manual: true }) });
  items.push({ grp: "Actions", icon: currentTheme() === "dark" ? "sun" : "moon", text: "Switch theme", run: toggleTheme });
  const q = S.cmdk.q.trim().toLowerCase();
  return q ? items.filter(i => (i.text + " " + (i.meta || "") + " " + (i.find || "")).toLowerCase().includes(q)) : items.filter(i => i.grp !== "Organisations").concat(items.filter(i => i.grp === "Organisations").slice(0, 8));
}
function renderCmdk() {
  const root = $("#cmdk-root");
  if (!S.cmdk.open) { root.innerHTML = ""; return; }
  const items = cmdItems(); S.cmdk.idx = Math.min(S.cmdk.idx, Math.max(0, items.length - 1));
  let last = "", html = "";
  items.forEach((it, i) => { if (it.grp !== last) { html += `<li class="grp" role="presentation">${it.grp}</li>`; last = it.grp; }
    html += `<li class="opt" role="option" id="cmd-${i}" data-cmd="${i}" aria-selected="${i === S.cmdk.idx}">${ico(it.icon)}<span class="truncate">${esc(it.text)}</span>${it.meta ? `<span class="meta">${esc(it.meta)}</span>` : ""}</li>`; });
  const existing = $("#cmdk-input");
  if (!existing) {
    root.innerHTML = `<div class="cmdk-back" data-cmdk-close><div class="cmdk" role="dialog" aria-modal="true" aria-label="Search">
      <div class="in">${ico("search")}<input id="cmdk-input" placeholder="Search organisations, replies or commands…" autocomplete="off" role="combobox" aria-expanded="true" aria-controls="cmdk-list"></div>
      <ul id="cmdk-list" role="listbox"></ul></div></div>`;
    $("#cmdk-input").focus();
  }
  $("#cmdk-list").innerHTML = items.length ? html : `<li class="none">No results.</li>`;
  $("#cmdk-input").setAttribute("aria-activedescendant", items.length ? "cmd-" + S.cmdk.idx : "");
  document.getElementById("cmd-" + S.cmdk.idx)?.scrollIntoView({ block: "nearest" });
}
function openCmdk() { S.cmdk = { open: true, q: "", idx: 0, ret: document.activeElement }; renderCmdk(); }
function closeCmdk() { const ret = S.cmdk.ret; S.cmdk = { open: false, q: "", idx: 0 }; renderCmdk(); ret?.focus?.(); }
function runCmd(i) { const it = cmdItems()[i]; closeCmdk(); it?.run(); }

/* ===================== render & routing ===================== */
function renderPlaceholder() {
  return `<div style="display:grid;gap:24px"><div class="sk" style="height:28px;width:280px"></div><div class="panel" style="padding:20px;display:grid;gap:14px">${[60, 80, 70, 50].map(w => `<div class="sk" style="height:14px;width:${w}%"></div>`).join("")}</div>
    <div class="kpis">${[0, 1, 2, 3].map(() => `<div class="panel kpi"><div class="sk" style="height:12px;width:50%"></div><div class="sk" style="height:28px;width:40%;margin-top:12px"></div></div>`).join("")}</div></div>`;
}
function render() {
  renderChrome();
  const view = $("#view");
  if (!S.data) { view.innerHTML = renderPlaceholder(); return; }
  const a = document.activeElement;
  const keep = { win: window.scrollY, list: $("#rlist")?.scrollTop, reader: $("#reader")?.scrollTop, focusId: a?.id, rid: a?.dataset?.rid, act: a?.dataset?.act, s0: a?.selectionStart, s1: a?.selectionEnd };
  view.className = "page v-" + S.view;
  view.innerHTML = S.view === "today" ? renderToday() : S.view === "replies" ? renderReplies() : renderOrgs();
  if (S.view === "today") drawActivity();
  renderOverlays();
  if (keep.list != null && $("#rlist")) $("#rlist").scrollTop = keep.list;
  if (keep.reader != null && $("#reader")) $("#reader").scrollTop = keep.reader;
  window.scrollTo(0, keep.win);
  if (S.cmdk.open || (S.org.id != null && $("#drawer-root").contains(document.activeElement))) return;
  const t = keep.focusId && keep.focusId !== "cmdk-input" ? document.getElementById(keep.focusId) : keep.rid ? document.querySelector(`.ritem[data-rid="${S.replies.selected}"]`)
    : keep.act && view.contains(a) === false ? (document.querySelector(`#view [data-act="${keep.act}"]:not(:disabled)`) || document.querySelector('#view [data-act="handled"]')) : null;
  if (t) { t.focus({ preventScroll: true }); if (keep.s0 != null && t.setSelectionRange) try { t.setSelectionRange(keep.s0, keep.s1); } catch (e) {} }
}
function route() {
  const h = (location.hash || "#today").slice(1), m = h.match(/^replies-(\d+)$/), prev = S.view;
  const om = h.match(/^org-(\d+)$/);
  if (om) {
    if (!S.lastOk) S.view = "organisations";
    if (S.org.id !== +om[1]) S.org = { id: +om[1], ret: document.activeElement };
    render(); if (S.data) loadTimeline(+om[1]);
    return;
  }
  if (S.org.id != null) S.org = { id: null };
  if (m) {
    S.view = "replies"; const id = +m[1];
    if (S.data && replyById(id) && !filteredReplies().some(x => x.id === id)) { S.replies.tab = "all"; S.replies.label = ""; S.replies.q = ""; }
    if (mobile() && !S.replies.reading) S.replies.mobileScroll = window.scrollY;
    S.replies.selected = id; S.replies.reading = true; S.actionError = null; S.actionOk = null;
  } else { S.view = NAV.some(n => n.view === h) ? h : "today"; if (S.view === "replies") S.replies.reading = false; }
  render();
  if (prev !== S.view || (m && mobile())) window.scrollTo(0, 0);
}
function selectReply(id) {
  if (mobile() && !S.replies.reading) S.replies.mobileScroll = window.scrollY;
  S.replies.selected = id; S.replies.reading = true; S.actionError = null; S.actionOk = null;
  history.replaceState(null, "", "#replies-" + id); render();
  const rd = $("#reader"); if (rd) rd.scrollTop = 0;
  document.querySelector(`.ritem[data-rid="${id}"]`)?.focus({ preventScroll: true });
  if (mobile()) window.scrollTo(0, 0);
}

/* ========================= events ========================= */
document.addEventListener("click", e => {
  if (e.target.closest("[data-cmdk-close]") && !e.target.closest(".cmdk")) return closeCmdk();
  if (e.target.classList?.contains("drawer-back")) return closeOrg();
  const opt = e.target.closest("[data-cmd]"); if (opt) return runCmd(+opt.dataset.cmd);
  const orgEl = e.target.closest("[data-org]");
  if (orgEl && !e.target.closest("a, .orgrow button, .orgrow a")) { S.org.ret = orgEl; return openOrg(+orgEl.dataset.org); }
  if (e.target.closest('[data-act="close-org-nav"]')) { S.org = { id: null }; renderOverlays(); return; }
  const t = e.target.closest("button, a[data-act]"); if (!t) return;
  const r = replyById(S.replies.selected);
  if (t.dataset.rid) return selectReply(+t.dataset.rid);
  if (t.dataset.tab) { S.replies.tab = t.dataset.tab; S.replies.selected = null; S.actionError = null; S.actionOk = null; return render(); }
  if (t.dataset.sort) { const [scope, key] = t.dataset.sort.split(":"), st = S[scope], text = ["name", "company", "industry"].includes(key);
    st.dir = st.sort === key ? (st.dir === "asc" ? "desc" : "asc") : (text ? "asc" : "desc"); st.sort = key; return render(); }
  switch (t.dataset.act) {
    case "palette": return openCmdk();
    case "theme": return toggleTheme();
    case "logout": return signOut();
    case "refresh": return refresh({ manual: true });
    case "handled": return r && setHandled(r, !r.handled);
    case "meeting": return r && setLeadStatus(r, "meeting");
    case "client": return r && setLeadStatus(r, "client");
    case "copy": return r && navigator.clipboard.writeText(r.from_email).then(() => toast("Copied " + r.from_email), () => toast("The address is " + r.from_email));
    case "back": S.replies.reading = false; history.replaceState(null, "", "#replies"); render(); window.scrollTo(0, S.replies.mobileScroll || 0);
      return document.querySelector(`.ritem[data-rid="${S.replies.selected}"]`)?.focus({ preventScroll: true });
    case "clear-replies": S.replies.q = ""; S.replies.label = ""; return render();
    case "clear-orgs": S.orgs.q = ""; S.orgs.industry = ""; S.orgs.status = ""; return render();
    case "close-org": return closeOrg();
    case "tl-retry": return loadTimeline(+t.dataset.lead, { force: true });
    case "expand": { const k = t.dataset.key; S.expanded.has(k) ? S.expanded.delete(k) : S.expanded.add(k); renderOverlays(); refreshReaderHistory(+k.split("-")[0]); return; }
  }
});
document.addEventListener("input", e => {
  const id = e.target.id, v = e.target.value;
  if (id === "cmdk-input") { S.cmdk.q = v; S.cmdk.idx = 0; return renderCmdk(); }
  if (id === "rq") S.replies.q = v; else if (id === "rlabel") S.replies.label = v;
  else if (id === "oq") S.orgs.q = v; else if (id === "oind") S.orgs.industry = v; else if (id === "ost") S.orgs.status = v; else return;
  render();
});
let gAt = 0;
document.addEventListener("keydown", e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); return S.cmdk.open ? closeCmdk() : openCmdk(); }
  if (S.cmdk.open) {
    const n = cmdItems().length;
    if (e.key === "Escape") { e.preventDefault(); return closeCmdk(); }
    if (e.key === "ArrowDown") { e.preventDefault(); S.cmdk.idx = Math.min(n - 1, S.cmdk.idx + 1); return renderCmdk(); }
    if (e.key === "ArrowUp") { e.preventDefault(); S.cmdk.idx = Math.max(0, S.cmdk.idx - 1); return renderCmdk(); }
    if (e.key === "Enter") { e.preventDefault(); return runCmd(S.cmdk.idx); }
    if (e.key === "Tab") { e.preventDefault(); $("#cmdk-input").focus(); }
    return;
  }
  if (S.org.id != null) {
    if (e.key === "Escape") { e.preventDefault(); return closeOrg(); }
    if (e.key === "Tab") { const f = [...document.querySelectorAll(".drawer button, .drawer a[href]")]; if (!f.length) return;
      const first = f[0], last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); } }
    return;
  }
  if (e.key === "Enter" && e.target.matches?.("tr[data-org]")) { e.preventDefault(); S.org.ret = e.target; return openOrg(+e.target.dataset.org); }
  if (isTyping(e.target) || e.metaKey || e.ctrlKey || e.altKey || !S.data) return;
  const k = e.key.toLowerCase();
  if (k === "g") { gAt = Date.now(); return; }
  if (Date.now() - gAt < 900) { const n = NAV.find(x => x.key.toLowerCase() === k); gAt = 0; if (n) { e.preventDefault(); location.hash = n.view; } return; }
  if (S.view !== "replies") return;
  const list = filteredReplies(), i = list.findIndex(r => r.id === S.replies.selected);
  const move = d => { const x = list[Math.max(0, Math.min(list.length - 1, i + d))]; if (x && x.id !== S.replies.selected) selectReply(x.id); };
  const inList = e.target.closest?.(".rlist");
  if (k === "j" || (e.key === "ArrowDown" && inList)) { e.preventDefault(); move(1); }
  else if (k === "k" || (e.key === "ArrowUp" && inList)) { e.preventDefault(); move(-1); }
  else if (k === "h") { const r = replyById(S.replies.selected); if (r && !S.pending) { e.preventDefault(); setHandled(r, !r.handled); } }
});
let rt; window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => { if (S.view === "today" && S.data) drawActivity(); }, 150); });
window.addEventListener("hashchange", route);
document.addEventListener("toggle", e => {
  const d = e.target; if (!d.matches?.(".sentsec")) return;
  const id = +d.dataset.sent, was = S.sentOpen.has(id);
  if (d.open === was) return;
  if (d.open) { S.sentOpen.add(id); refreshReaderHistory(id); loadTimeline(id); } else S.sentOpen.delete(id);
}, true);
document.addEventListener("visibilitychange", () => { if (!document.hidden && S.mode === "live" && Date.now() - S.lastOk > POLL_MS) poll(); });
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", () => { renderChrome(); if (S.view === "today" && S.data) drawActivity(); });

applyStoredTheme();
route();
getJSON("api/auth/me").then(m => {
  const name = (m.user?.name || "").trim();
  OPERATOR = name.split(/\s+/)[0];
  if (name) {
    $("#me").innerHTML = `<span class="av" aria-hidden="true">${esc(name[0].toUpperCase())}</span>
      <div><b>${esc(name)}</b><span>${m.user.role === "admin" ? "Admin" : "Sales"} · signed in</span></div>`;
    $("#me").hidden = false;
  }
  if (S.data) render();
}).catch(() => {});
refresh().then(route);
setInterval(poll, POLL_MS);
setInterval(() => { if (S.data && !busy()) renderChrome(); }, 30000);
</script>
