# One entry per industry (the name matches the file in templates/).
# approved: true  = leads in this industry may be emailed.
#           false = the sender skips them and leaves them waiting.
# uses: the approved SMS uses, for templates that have a {uses} slot (the first three
#       are used). The seven approved templates name their uses in their own fixed text.
# variants: (optional, A/B/C/D rotation niches only) which first emails new leads may get, e.g.
#       variants: [A, B] switches C and D off. Leave it out for all four. A lead that already has
#       a variant keeps it, and its follow-ups, whatever this says.
# paused_until: (optional) a date, e.g. 2027-01-05. Until then the industry gets no first emails
#       and no follow-ups; its leads stay exactly as they are. On that date (Nairobi time)
#       sending resumes by itself where each lead left off.
# about, noun, sms_uses: (every approved niche) variant D's words. about finishes "I came across
#       {company} and ..."; noun is "a SACCO", "a water company"...; sms_uses are 4-5 natural
#       phrases, joined "a, b, c and d" in the first email; follow-up 1 names the first two.
